<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Главная страница</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="calcul.css">
    </head>
    <body>
        <div class="menu">
            <ul>
                <li class="up"><button id="first">Первый пункт</button></li>
                <ul id="op"class="downmenu">
                    <li><button id="calcul">Калькулятор</button></li>
                </ul>
                <li class="up"><button>Второй пункт</button></li>
            </ul>
        </div>
        <div class="calcul" id="sch">
            <div class="tablo"></div>
            <div class="keyboard">
                <button class="one">1</button>
                <button class="two">2</button>
                <button class="three">3</button>
                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>
                <button class="zero">0</button>
                <button class="delen">/</button>
                <button class="umnog">*</button>
                <button class="razn">-</button>
                <button class="sum">+</button>
                <button class="ravno">=</button>
                <button class="reset">+/-</button>
                <button class="proc">%</button>
                <button class="ac">AC</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
    
</html>
